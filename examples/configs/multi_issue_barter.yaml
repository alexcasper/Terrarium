simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - multi_issue_barter

environment:
  name: MultiIssueBarterEnvironment
  num_issues: 5
  total_units: 10
  agenda_mode: package
  agenda_order: [0, 1, 2, 3, 4]

communication_network:
  topology: complete
  num_agents: 2
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
