simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - smart_grid_storage

environment:
  name: SmartGridStorageEnvironment
  base_prices: [20, 50, 90, 60, 20]
  price_impact: 2
  capacity_per_agent: 10
  initial_level: 0
  withhold_price_threshold: 80

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on dawn CPU).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
