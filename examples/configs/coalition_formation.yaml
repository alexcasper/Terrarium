simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - coalition_formation

environment:
  name: CoalitionFormationEnvironment
  base_weights:
    - 10
    - 15
    - 20
    - 25
  synergy_low: 4
  synergy_high: 12
  synergy_multiplier: 2
  coordination_overhead: 3
  optimal_coalition_size: 3

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
