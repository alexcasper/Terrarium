simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - ad_auction_gsp

environment:
  name: AdAuctionGSPEnvironment
  clicks_per_iteration: 100
  reserve_price: 1.0
  value_range: [2, 15]
  slots:
    - name: slot_1
      ctr: 0.5
    - name: slot_2
      ctr: 0.3
    - name: slot_3
      ctr: 0.1

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on AUP pod).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
