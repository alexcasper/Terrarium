simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - shared_cache
    - poison

environment:
  name: SharedCacheEnvironment
  num_keys: 8
  keys_per_agent: 2
  truth_low: 100
  truth_high: 999
  write_cost: 6
  hit_reward: 30
  compute_cost: 18
  poison_victim_penalty: -15
  poisoner_bounty: 20
  poisoners:
    - agent_4

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
