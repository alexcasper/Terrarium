simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - legislative_bargaining
    - board_visible

environment:
  name: LegislativeBargainingEnvironment
  num_bills: 3
  sponsor_benefit: 35
  tax_cost: 10
  public_good_benefit: 16
  board_visibility: false

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
