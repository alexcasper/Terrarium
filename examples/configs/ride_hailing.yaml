simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - ride_hailing

environment:
  name: RideHailingDispatchEnvironment
  num_zones: 4
  riders_per_wave: 8
  capacity_per_driver: 2
  base_price: 15
  surge_coeff: 3
  price_cap: 60
  wtp_low: 10
  wtp_high: 40

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
