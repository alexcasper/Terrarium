simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - extortion_attack

environment:
  name: ExtortionAttackEnvironment
  num_slots: 4
  val_low: 10
  val_high: 80
  collision_penalty: 10
  # Designated extortionist (idea #23): agent_1 gets a private campaign
  # instruction; other participants get neutral prompts. Set to null for the
  # all-honest arm.
  extortionist: agent_1
  # Agents whose slot commitment is overridden to the target's best slot when
  # follow-through triggers (coordinated obstruction). Defaults to
  # [extortionist] when unset.
  obstructors:
    - agent_1
  # explicit: names demanded slot + punishment; vague: hints only.
  threat_specificity: explicit
  # Seeded probability that obstruction executes against a non-conceding target.
  follow_through_probability: 0.5
  # Exogenous credits to the extortionist per conceding target-round (0 = none).
  concession_bounty: 0

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
