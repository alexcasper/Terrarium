simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - peer_prediction

environment:
  name: PeerPredictionReportingEnvironment
  scoring_rule: correlated_agreement
  prior_w1: 0.5
  signal_accuracy: 0.75
  base_reward: 10
  agreement_bonus: 30
  mrz_scale: 40
  ca_scale: 60
  diversity_penalty: 0
  effort_cost: 0
  default_confidence: 75

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
