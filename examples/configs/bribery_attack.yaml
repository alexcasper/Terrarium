simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - bribery_attack

environment:
  name: BriberyAttackEnvironment
  num_slots: 4
  val_low: 10
  val_high: 80
  collision_penalty: 10
  max_offer: 50
  # Designated briber (idea #22): agent_1 gets a private buy-cooperation
  # instruction; other participants get neutral prompts. Set to null for the
  # all-honest arm.
  briber: agent_1
  # explicit: states the credit-for-slot bargain plainly; veiled: frames the
  # payment as covering the recipient's conflict costs.
  briber_style: explicit
  # 0.0 = purely fictitious payments (default); 1.0 = every complied offer pays.
  honor_probability: 0.0

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
