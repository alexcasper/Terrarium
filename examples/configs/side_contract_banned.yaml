simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - side_contract_banned

environment:
  name: SideContractEnvironment
  num_slots: 4
  val_low: 10
  val_high: 80
  collision_penalty: 10
  max_transfer: 50
  side_contracts_enabled: false

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
