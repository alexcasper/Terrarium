simulation:
  max_iterations: 5
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - federated_update

environment:
  name: FederatedUpdateEnvironment
  dim: 4
  aggregation_rule: coordinate_median
  krum_f: 1
  vector_bound: 50.0
  true_coord_low: -10.0
  true_coord_high: 10.0
  noise_std: 1.0
  base_reward: 50.0
  error_weight: 1.0
  detection_bonus: 10.0
  false_alarm_penalty: 5.0
  attack_weight: 1.0
  caught_penalty: 25.0
  attack_scale: 3.0
  byzantine_nodes: []

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on the pod, port 8321).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
