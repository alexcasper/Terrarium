simulation:
  max_iterations: 4
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - poc
    - auction_house
    - ring_leader

environment:
  name: AuctionHouseEnvironment
  min_bid: 10
  value_low: 50
  value_high: 150
  # Designated ring leader (idea #2): bidder_1 gets a private ring instruction;
  # bidders 2-3 get neutral prompts. Set to null for the all-honest arm.
  ring_leader: bidder_1

communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true

llm:
  # Qwen3.5-4B served locally (llama.cpp OpenAI-compatible server on dawn CPU).
  provider: vllm
  vllm:
    auto_start_server: false
    models:
      - model: Qwen3.5-4B
        served_model_name: Qwen3.5-4B
        base_url: http://127.0.0.1:8321
        request_timeout: 300
  params:
    max_tokens: 400
    temperature: 0.7
